apiVersion: batch/v1
kind: CronJob
metadata:
  name: frigate-backup
  namespace: frigate
spec:
  schedule: "0 2 * * *"        # 2:00 AM daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid     # don't overlap if a sync runs long
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400  # 4h max — safety net for large syncs
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: k3frigate
          restartPolicy: Never
          containers:
            - name: backup
              # rsync+ssh baked in — no runtime apk install (failed silently
              # whenever cluster DNS/egress was down at 02:00; see 2026-06-10)
              image: instrumentisto/rsync-ssh:alpine3.22
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /ssh/id_ed25519"
                  SRC="/data/"
                  DEST="user@192.168.100.52:/mnt/frigate/"

                  echo "[$(date)] Starting rsync mirror to k3master (.52, 1.8T)..."

                  # Incremental sync — only transfers new/changed files
                  # --delete removes files on backup that Frigate already purged
                  # --exclude model_cache (re-downloadable, ~100MB)
                  # exit 23/24 = files vanished mid-sync (Frigate retention
                  # pruning overlaps the sync window) — expected, not a failure
                  rc=0
                  rsync -avz --delete --partial --bwlimit=20000 \
                    --exclude='model_cache/' \
                    --rsync-path=/usr/bin/rsync \
                    -e "ssh ${SSH_OPTS}" \
                    "${SRC}" "${DEST}" || rc=$?

                  if [ "$rc" -ne 0 ] && [ "$rc" -ne 23 ] && [ "$rc" -ne 24 ]; then
                    echo "[$(date)] Rsync failed with exit code $rc"
                    exit "$rc"
                  fi

                  echo "[$(date)] Rsync mirror complete (rsync exit $rc)."
              volumeMounts:
                - name: frigate-data
                  mountPath: /data
                  readOnly: true
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
          volumes:
            - name: frigate-data
              hostPath:
                path: /mnt/frigate
                type: Directory
            - name: ssh-key
              secret:
                secretName: jumphost-ssh-key
                defaultMode: 0400
