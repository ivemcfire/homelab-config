apiVersion: v1
kind: ConfigMap
metadata:
  name: chickenflow-config
  namespace: chickenflow
data:
  CAPTURES_DIR: /data/captures
  COOP_TZ: Europe/Sofia
  FRIGATE_COOP_CAM: cam01
  FRIGATE_URL: http://192.168.100.209:5000
  PORT: "4000"
  # MQTT_URL is set as an explicit env on the backend Deployment (not here) —
  # see deploy-backend.yaml. Kept out of the ConfigMap so the broker
  # namespace dependency is visible directly on the workload that needs it.
  # OLLAMA_URL / OLLAMA_MODEL removed: no code path references Ollama anymore
  # (backend uses gemini.service.ts exclusively). ollama-service.yaml from the
  # old chickenFlow/deploy/ was legacy and was not carried over — see WP5 report.
