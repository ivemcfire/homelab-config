apiVersion: apps/v1
kind: Deployment
metadata:
  name: chickenflow-backend
  namespace: chickenflow
  labels:
    app: chickenflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chickenflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: chickenflow
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chickenflow
          # Pinned to the built release SHA — update per release, no :latest.
          image: ghcr.io/ivemcfire/chickenflow:sha-0eba3d7
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chickenflow-db-secret
                  key: url
            # Broker moved hydroflow -> infra namespace (WP5). Explicit here
            # (rather than in the ConfigMap) so the dependency on the infra
            # broker is visible directly on the workload.
            - name: MQTT_URL
              value: mqtt://mosquitto.infra.svc.cluster.local:1883
            # Angular SSR's SSRF host guard rejects serving by raw IP and
            # silently falls back to client-side rendering; the UI is reached
            # via the MetalLB IP, so allow it explicitly.
            - name: NG_ALLOWED_HOSTS
              value: "192.168.100.211"
          envFrom:
            - configMapRef:
                name: chickenflow-config
            - secretRef:
                name: gemini-api
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            # /api/health returns 503 once MQTT has been down >10 min (intentional
            # restart-on-deaf behavior). periodSeconds/failureThreshold give a
            # further ~2.5 min of sustained 503 before a restart is triggered, so
            # transient broker blips don't hair-trigger pod restarts.
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # NOTE: in-cluster mounts /data from PVC chickenflow-db-pvc but that
          # PVC is flagged STALE in cluster-improvements row 33. We omit the
          # PVC + volumeMount from IaC; reroll script skips this PVC too.
          # Captures persist only ephemerally until a fresh PVC strategy is decided.
