# Secrets stub for chickenflow namespace.
# Actual base64 values live in the cluster and in $BK/ns-secrets.yaml.
# Reroll script applies real secrets from backup; this file is documentation only
# and is intentionally NOT applied during reroll (skipped by the IaC apply loop).
#
# Secrets in this namespace:
#   - ai-secret              Opaque             (key: api-key — LEGACY, superseded by gemini-api below; not referenced by current Deployment)
#   - gemini-api             Opaque             (key: GEMINI_API_KEY — Gemini key, envFrom'd into chickenflow-backend)
#   - chickenflow-db-secret  Opaque             (key: url — postgres DSN)
#   - chickenflow-postgres-secret Opaque        (keys: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD)
#   - ghcr-secret            dockerconfigjson   (key: .dockerconfigjson — ghcr.io pull creds)
#   - jumphost-ssh-key       Opaque             (key: id_ed25519 — used by backup CronJob to scp to .62)
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: chickenflow
type: Opaque
data:
  api-key: "" # PLACEHOLDER — actual base64 value preserved in cluster Secret; reroll script does NOT overwrite secrets during apply (applies real values from backup ns-secrets.yaml)
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-api
  namespace: chickenflow
type: Opaque
data:
  GEMINI_API_KEY: "" # PLACEHOLDER — actual base64 value preserved in cluster Secret; reroll script does NOT overwrite secrets during apply
---
apiVersion: v1
kind: Secret
metadata:
  name: chickenflow-db-secret
  namespace: chickenflow
type: Opaque
data:
  url: "" # PLACEHOLDER — actual base64 value preserved in cluster Secret; reroll script does NOT overwrite secrets during apply
---
apiVersion: v1
kind: Secret
metadata:
  name: chickenflow-postgres-secret
  namespace: chickenflow
type: Opaque
data:
  POSTGRES_DB: "" # PLACEHOLDER
  POSTGRES_USER: "" # PLACEHOLDER
  POSTGRES_PASSWORD: "" # PLACEHOLDER — actual base64 values preserved in cluster Secret; applied from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: chickenflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "" # PLACEHOLDER — ghcr.io pull creds; restored from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: jumphost-ssh-key
  namespace: chickenflow
type: Opaque
data:
  id_ed25519: "" # PLACEHOLDER — ssh key for backup CronJob; restored from backup
