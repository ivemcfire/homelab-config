apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkit
  namespace: buildkit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildkit
  namespace: buildkit
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildkit
  namespace: buildkit
subjects:
  - kind: ServiceAccount
    name: buildkit
    namespace: buildkit
roleRef:
  kind: Role
  name: buildkit
  apiGroup: rbac.authorization.k8s.io
