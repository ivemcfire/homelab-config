n\u0026password=\u0026channel=1\u0026stream=1.sdp\n    cam16:\n      - rtsp://admin:@192.168.100.16:554/user=admin\u0026password=\u0026channel=1\u0026stream=0.sdp\n    cam16_sub:\n      - rtsp://admin:@192.168.100.16:554/user=admin\u0026password=\u0026channel=1\u0026stream=1.sdp\n\n    # Reolink (.17) — 4K main (H.265), sub (H.264). TCP required.\n    cam17:\n      - rtsp://admin:{FRIGATE_REOLINK_PASSWORD}@192.168.100.17:554/h264Preview_01_main\n    cam17_sub:\n      - rtsp://admin:{FRIGATE_REOLINK_PASSWORD}@192.168.100.17:554/h264Preview_01_sub\n    # cam17_detect removed — go2rtc transcode too CPU-heavy\n\n    # Xiaomi Yi (.19) — yi-hack firmware, no auth\n    cam19:\n      - rtsp://192.168.100.19:554/ch0_0.h264\n    cam19_sub:\n      - rtsp://192.168.100.19:554/ch0_1.h264\n\n# --- FFmpeg Hardware Acceleration ---\n# NVIDIA NVDEC on GTX 1050Ti (Pascal). preset-nvidia covers H.264 + H.265.\nffmpeg:\n  hwaccel_args: preset-nvidia\n\n# --- Detection ---\n# TensorRT via ONNX runtime, GTX 1050Ti.\ndetectors:\n  onnx:\n    type: onnx\n\nmodel:\n  path: /config/model_cache/yolov9s.onnx\n  input_tensor: nchw\n  input_pixel_format: rgb\n  input_dtype: float\n  width: 320\n  height: 320\n  model_type: yolo-generic\n  labelmap_path: /labelmap/coco-80.txt\n\n# --- Face Recognition ---\n# Built-in Frigate 0.17 feature. Uses person detection snapshots\n# to identify known faces. Faces are stored in /config/clips/faces.\n# Only enabled on cam17_reolink (4K — best resolution for face matching).\nface_recognition:\n  enabled: true\n  model_size: small\n  min_area: 1500\n  detection_threshold: 0.4\n\n# --- Camera Defaults ---\n# Applied to all cameras unless overridden per-camera.\n# This keeps the config DRY — Don't Repeat Yourself.\nobjects:\n  track:\n    - person\n  filters:\n    person:\n      min_score: 0.5\n      threshold: 0.7\n\nrecord:\n  enabled: true\n  # Frigate 0.15 splits recording into categories:\n  #   continuous — always recording (we don't want this)\n  #   moti