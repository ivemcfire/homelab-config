apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-inference-worker
  namespace: gpu-inference
  labels:
    app: mqtt-inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-inference-worker
  template:
    metadata:
      labels:
        app: mqtt-inference-worker
    spec:
      # arm64 = phone-only. Pulls from in-cluster gitea registry via
      # /etc/rancher/k3s/registries.yaml HTTP mirror on each node.
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Always
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: worker
          image: 192.168.100.206/homelab/mqtt-inference-worker:20260513-0544
          imagePullPolicy: IfNotPresent
          env:
            # WP5: was mosquitto.hydroflow.svc.cluster.local (DNS name). Phone
            # nodes (this pod is arch:arm64 == phone-only) have broken in-pod DNS,
            # so a namespace-qualified DNS name here never actually resolved. Using
            # the raw MetalLB LB IP instead (immovable, matches the ESP32 firmware's
            # own hardcoded broker address) makes this correct today AND survives
            # the hydroflow -> infra namespace move, since it isn't DNS at all.
            - name: MQTT_BROKER
              value: "192.168.100.207"
            - name: MQTT_PORT
              value: "1883"
            - name: FRIGATE_URL
              value: http://frigate.frigate.svc.cluster.local:5000
            - name: ONNX_MODEL_PATH
              value: /models/yolov8n.onnx
            - name: CONF_THRESHOLD
              value: "0.25"
            - name: RUSTICL_ENABLE
              value: freedreno
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              # Provided by smarter-device-manager DaemonSet (arm64 nodes).
              smarter-devices/dri_renderD128: 1
