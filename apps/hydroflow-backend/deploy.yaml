apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydroflow-backend
  namespace: hydroflow
  labels:
    app: hydroflow-backend
    app.kubernetes.io/part-of: hydroflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydroflow-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hydroflow-backend
        app.kubernetes.io/part-of: hydroflow
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: gitea-registry
      # Image is arm64-ONLY (built for phone nodes). Phones carry the
      # node-role/phone:NoSchedule taint (2026-06-22), so this workload needs
      # an explicit toleration; pinned to one6t (one62 browns out under load).
      # VERIFIED 2026-07-07: the app reads MQTT_URL from env and holds a live
      # broker connection from one6t — in-pod DNS resolves cluster services
      # there. (A 2026-07-06 commit claimed a hardcoded-URL fault; that was
      # misread from a stale pre-rollout pod's logs. Expect occasional MQTT
      # reconnects, ~2h cadence, on the phone node — the client recovers.)
      tolerations:
        - key: node-role/phone
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: one6t
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres
                topologyKey: kubernetes.io/hostname
      containers:
        - name: hydroflow-backend
          image: 192.168.100.206/ivemcfire/hydroflow-backend:20260513-0554
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_COLOR
              value: green
            - name: MQTT_BROKER
              value: mqtt://mosquitto.infra.svc.cluster.local:1883
            - name: MQTT_URL
              value: mqtt://mosquitto.infra.svc.cluster.local:1883
            - name: DB_HOST
              value: postgres.hydroflow.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
