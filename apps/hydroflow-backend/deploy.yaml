apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydroflow-backend
  namespace: hydroflow
  labels:
    app: hydroflow-backend
    app.kubernetes.io/part-of: hydroflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydroflow-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hydroflow-backend
        app.kubernetes.io/part-of: hydroflow
    spec:
      terminationGracePeriodSeconds: 30
      # WP3: image is now multi-arch (linux/amd64 + linux/arm64) from GitHub
      # Actions buildx, so the old arm64-only constraints are gone: no more
      # one6t nodeSelector, no node-role/phone toleration. Phones stay
      # excluded by their node-role/phone:NoSchedule taint (2026-06-22);
      # any non-phone node (incl. control plane) may run this pod.
      # ghcr.io/ivemcfire images are public (same assumption as chickenflow,
      # whose ghcr pulls work without creds) — no imagePullSecrets needed.
      containers:
        - name: hydroflow-backend
          # sha-PLACEHOLDER: the orchestrator pins the real sha-<shortsha> tag
          # after the first CI build on main publishes the image. No :latest —
          # CI pushes sha-only tags.
          image: ghcr.io/ivemcfire/hydroflow-backend:sha-37d9113
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # MQTT via cluster DNS — broker lives in the infra namespace (WP5).
            # Do NOT switch this to the LB IP 192.168.100.207: using the LB IP
            # from inside the cluster hair-pins and RSTs the connection
            # (see k8s-ops skill references/networking-troubleshooting.md §2–3).
            - name: MQTT_URL
              value: mqtt://mosquitto.infra.svc.cluster.local:1883
            - name: DB_HOST
              value: postgres.hydroflow.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          envFrom:
            # GEMINI_API_KEY for AI insights — optional: the backend degrades
            # gracefully (disables insights) when the key is absent, and the
            # pod must still start if the secret hasn't been created yet.
            - secretRef:
                name: gemini-api
                optional: true
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
          # /healthz returns 503 once MQTT has been down >10 min (intentional
          # restart-on-deaf behavior, chickenflow lesson). Generous liveness
          # period/threshold adds ~2.5 min of sustained 503 before restart so
          # transient broker blips don't hair-trigger pod restarts.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
