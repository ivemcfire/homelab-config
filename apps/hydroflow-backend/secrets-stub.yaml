# Secrets stub for hydroflow namespace (hydroflow-backend + mosquitto + postgres).
# Real values applied from $BK/ns-secrets.yaml by the reroll script.
# This file is documentation only; reroll IaC apply loop SKIPS secret kinds.
#
# Secrets in this namespace:
#   - gemini-secret    Opaque             (key: api-key — Gemini key)
#   - gitea-registry   dockerconfigjson   (gitea registry pull creds for 192.168.100.206)
#   - postgres-secret  Opaque             (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD)
#   - jumphost-ssh-key Opaque             (id_ed25519 for backup CronJob)
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: hydroflow
type: Opaque
data:
  api-key: "" # PLACEHOLDER — actual base64 value preserved in cluster Secret; reroll script does NOT overwrite secrets during apply
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry
  namespace: hydroflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "" # PLACEHOLDER — gitea registry pull creds; restored from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hydroflow
type: Opaque
data:
  POSTGRES_DB: "" # PLACEHOLDER
  POSTGRES_USER: "" # PLACEHOLDER
  POSTGRES_PASSWORD: "" # PLACEHOLDER — restored from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: jumphost-ssh-key
  namespace: hydroflow
type: Opaque
data:
  id_ed25519: "" # PLACEHOLDER — restored from backup
