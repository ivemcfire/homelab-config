# Secrets stub for hydroflow namespace (hydroflow-backend + postgres). Mosquitto moved to the infra namespace (WP5) and has no secrets of its own.
# Real values applied from $BK/ns-secrets.yaml by the reroll script.
# This file is documentation only; reroll IaC apply loop SKIPS secret kinds.
#
# Secrets in this namespace:
#   - gemini-api       Opaque             (key: GEMINI_API_KEY — envFrom'd into hydroflow-backend; hydroflow ns needs its OWN copy, secrets don't cross namespaces — chickenflow ns has a sibling)
#   - gemini-secret    Opaque             (key: api-key — LEGACY, superseded by gemini-api above; not referenced by current Deployment)
#   - gitea-registry   dockerconfigjson   (gitea registry pull creds for 192.168.100.206 — LEGACY as of WP3: images moved to public ghcr.io, no imagePullSecrets in the Deployment anymore)
#   - postgres-secret  Opaque             (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD)
#   - jumphost-ssh-key Opaque             (id_ed25519 for backup CronJob)
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-api
  namespace: hydroflow
type: Opaque
data:
  GEMINI_API_KEY: "" # PLACEHOLDER — create with the real key (see MIGRATION-wp3.md); reroll script does NOT overwrite secrets during apply
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: hydroflow
type: Opaque
data:
  api-key: "" # PLACEHOLDER — LEGACY; actual base64 value preserved in cluster Secret; reroll script does NOT overwrite secrets during apply
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry
  namespace: hydroflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "" # PLACEHOLDER — LEGACY gitea registry pull creds; unused once the backend runs the ghcr image; restored from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hydroflow
type: Opaque
data:
  POSTGRES_DB: "" # PLACEHOLDER
  POSTGRES_USER: "" # PLACEHOLDER
  POSTGRES_PASSWORD: "" # PLACEHOLDER — restored from backup
---
apiVersion: v1
kind: Secret
metadata:
  name: jumphost-ssh-key
  namespace: hydroflow
type: Opaque
data:
  id_ed25519: "" # PLACEHOLDER — restored from backup
