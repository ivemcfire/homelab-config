apiVersion: apps/v1
kind: Deployment
metadata:
  name: compreface-core
  namespace: face-recognition
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: compreface-core } }
  template:
    metadata: { labels: { app: compreface-core } }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3frigate }
      containers:
        - name: core
          image: exadel/compreface-core:1.2.0
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: ML_PORT, value: "3000" }
            - { name: UWSGI_PROCESSES, value: "2" }
            - { name: UWSGI_THREADS, value: "2" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 1500m, memory: 2Gi }
          volumeMounts:
            - { name: models, mountPath: /app/ml/.models }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: compreface-models }
---
apiVersion: v1
kind: Service
metadata:
  name: compreface-core
  namespace: face-recognition
spec:
  selector: { app: compreface-core }
  ports: [{ port: 3000, targetPort: http, name: http }]
