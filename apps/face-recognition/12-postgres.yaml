apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: face-recognition
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3frigate }
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-creds }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: pg }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: [pg_isready, -U, compreface, -d, frs] }
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: compreface-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: face-recognition
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: pg, name: pg }]
