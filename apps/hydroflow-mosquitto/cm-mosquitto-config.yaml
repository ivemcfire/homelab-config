apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: hydroflow
  labels:
    app: mosquitto
    app.kubernetes.io/part-of: hydroflow
data:
  mosquitto.conf: |
    # Network
    listener 1883
    protocol mqtt

    # Security — open for ESP32 sensors on local LAN
    # Change to false and configure password_file for production hardening
    allow_anonymous true

    # Persistence — survives pod restarts
    persistence true
    persistence_location /mosquitto/data/

    # Logging
    log_dest file /mosquitto/log/mosquitto.log
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    # Connection tuning
    max_keepalive 120
    max_connections 500
