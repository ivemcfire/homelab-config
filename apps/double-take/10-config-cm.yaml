apiVersion: v1
kind: ConfigMap
metadata:
  name: double-take-config
  namespace: frigate
data:
  config.yml: |
    # Double Take config — recognition aggregator linking Frigate → CompreFace
    # https://github.com/skrashevich/double-take

    mqtt:
      host: mosquitto.frigate.svc.cluster.local
      port: 1883
      topics:
        frigate: frigate/events
        matches: double-take/matches
        cameras: double-take/cameras
      client_id: double-take

    frigate:
      url: http://frigate.frigate.svc.cluster.local:5000
      update_sub_labels: true
      stop_on_match: true
      min_area: 10000
      attempts:
        latest: 5
        snapshot: 3
        mqtt: 3
        delay: 1
      events:
        zones: []
      labels:
        - person
      image:
        height: 720
      cameras:
        cam17_reolink:
          snapshot:
            attempts: 5
        cam22:
          snapshot:
            attempts: 5

    detect:
      match:
        save: true
        confidence: 70
        purge: 168       # hours — clear old matches
        min_area: 10000
      unknown:
        save: true
        confidence: 30
        purge: 8

    detectors:
      compreface:
        url: http://compreface-api.face-recognition.svc.cluster.local:8080
        key: REPLACE_AT_DEPLOY_TIME_FROM_CREDENTIALS_MD_AGE
        det_prob_threshold: 0.7
        face_plugins: gender,age,mask
        sync: false
        cache: 1000

    notify:
      mqtt:
        topic: double-take/matches
