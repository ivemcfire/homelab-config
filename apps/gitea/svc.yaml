apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.206"
spec:
  type: LoadBalancer
  selector:
    app: gitea
  ports:
  - name: http
    port: 80
    targetPort: 3000
  - name: ssh
    port: 22
    targetPort: 22
