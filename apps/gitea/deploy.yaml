apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3frigate
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
      - name: gitea
        image: gitea/gitea:1.22.6
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        - name: GITEA__server__ROOT_URL
          value: "http://192.168.100.206/"
        - name: GITEA__server__SSH_DOMAIN
          value: "192.168.100.206"
        - name: GITEA__server__SSH_PORT
          value: "22"
        - name: GITEA__packages__ENABLED
          value: "true"
        - name: GITEA__service__DISABLE_REGISTRATION
          value: "true"
        - name: GITEA__picture__DISABLE_GRAVATAR
          value: "true"
        ports:
        - name: http
          containerPort: 3000
        - name: ssh
          containerPort: 22
        volumeMounts:
        - name: gitea-data
          mountPath: /data
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: gitea-data
        persistentVolumeClaim:
          claimName: gitea-data
