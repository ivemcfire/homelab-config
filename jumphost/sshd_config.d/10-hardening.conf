# Managed; source-controlled in homelab-config/jumphost/
# Bastion-grade sshd hardening for jumphost.62 — Debian 13

# --- authentication ---
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 6
MaxStartups 5:50:10

# --- session hygiene ---
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes
AllowAgentForwarding yes
AllowTcpForwarding yes
X11Forwarding no
PermitUserEnvironment no
PrintMotd no
Banner none

# --- modern crypto only (drop CBC, weak DH, sha1) ---
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,sntrup761x25519-sha512@openssh.com,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# --- logging ---
LogLevel VERBOSE
